name: Publish beta Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: major.minor.patch (beta counter is automatic)
        required: true
        type: string
      resume_tag:
        description: Existing tag to resume (leave empty for a new release)
        required: false
        type: string
permissions:
  contents: write
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      channel: beta
      resume_tag: ${{ inputs.resume_tag }}
    secrets: inherit
