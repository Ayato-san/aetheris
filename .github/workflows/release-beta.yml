name: Publish beta Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: major.minor.patch (beta counter is automatic)
        required: true
        type: string
      debug:
        description: Build beta executables in debug mode
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      channel: beta
      debug: ${{ inputs.debug }}
    secrets: inherit
