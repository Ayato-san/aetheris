name: Build, sign and publish Windows
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: false
permissions:
  contents: write
# Both entry workflows share the same lock, including beta tag allocation.
concurrency:
  group: aetheris-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    env:
      AETHERIS_REPOSITORY: ${{ github.repository }}
      AETHERIS_PUBLIC_KEY: ${{ vars.AETHERIS_PUBLIC_KEY }}
      CARGO_INCREMENTAL: '0'
      BUILD_PROFILE: ${{ inputs.channel == 'beta' && inputs.debug && 'dev' || 'release' }}
      BUILD_DIRECTORY: ${{ inputs.channel == 'beta' && inputs.debug && 'debug' || 'release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Require distribution key
        shell: pwsh
        run: |
          if ($env:AETHERIS_PUBLIC_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw 'Configure the release environment public key first' }
      - name: Prepare version and release commit
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        shell: pwsh
        run: |
          python scripts/prepare_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Commit the resolved release version
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff -- Cargo.toml Cargo.lock CHANGES.md CHANGES.beta.md
          git status --short
          git add Cargo.toml Cargo.lock CHANGES.md CHANGES.beta.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $message = "chore(release): prepare v$env:RESOLVED_VERSION`n`nChangelog-Exempt: stable — gel automatique des notes de version`nChangelog-Exempt: beta — gel automatique des notes de version"
          $message | Set-Content -Encoding utf8NoBOM release-commit.txt
          python scripts/changelog.py check-commit release-commit.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git commit --allow-empty -F release-commit.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item release-commit.txt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test domain and updater
        run: cargo test --locked --no-default-features
      - name: Test capture firewall lifecycle without modifying firewall rules
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_capture_firewall.ps1
      - name: Check all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compile Windows programs
        run: cargo build --locked --profile $env:BUILD_PROFILE --bin aetheris --bin aetheris-companion --bin aetheris-update-helper
      - name: Sign and package
        env:
          AETHERIS_SIGNING_KEY: ${{ secrets.AETHERIS_SIGNING_KEY }}
        run: cargo run --locked --release --no-default-features --bin aetheris-release -- package target/$env:BUILD_DIRECTORY aetheris-windows-x86_64.zip
      - name: Build offline installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Official Inno Setup compiler missing' }
          $binaries = (Resolve-Path "target/$env:BUILD_DIRECTORY").Path
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DBuildDirectory=$binaries" installer/aetheris.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Push matching commit and tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git tag $tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push --atomic origin HEAD:main $tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes_path }}
        run: python scripts/publish_release.py
