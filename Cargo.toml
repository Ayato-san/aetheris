[package]
name = "aetheris"
default-run = "aetheris"
version = "0.1.0-beta.5"
edition = "2024"
description = "Companion desktop application and game overlay"
license = "MIT"
rust-version = "1.98"

[features]
default = ["gui"]
ui-tests = ["gui", "gpui/test-support"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"], optional = true }
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup"] }
getrandom = "0.3"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
hex = "0.4"
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Services", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Shell"] }

[build-dependencies]
serde_json = "1"
embed-resource = "3.0.12"

[[bin]]
name = "aetheris"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "aetheris-companion"
path = "src/bin/companion.rs"

[[bin]]
name = "aetheris-update-helper"
path = "src/bin/update_helper.rs"

[[bin]]
name = "aetheris-release"
path = "src/bin/release.rs"

[profile.release]
lto = "thin"
strip = true

# GPUI's debug renderer reads HLSL from its build machine's source checkout.
# Disable that path for both the Windows crate and its shader build script so
# debug executables embed compiled shaders and can run on another machine.
[profile.dev.package.gpui_windows]
debug-assertions = false
